<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업부(시흥) 스케줄관리</title>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">
<script>
// ══════════════════════════════════════════════════════════
//  선행 요청 (prefetch)
//  GAS 호출 1회는 수백ms~수초. HTML/CSS가 파싱되기를 기다리지 않고
//  첫 화면에 필요한 조회를 여기서 곧바로 동시에 쏴 둔다.
//  아래 응답은 api()가 그대로 받아 쓴다.
// ══════════════════════════════════════════════════════════
var GAS_URL = 'https://script.google.com/macros/s/AKfycbwl-hvK6QffGot9hRIL_A_3AnT1b0p_lKt2tk6X-EsuJvjBdI5Oc8M_pubrlpPthy2X/exec'; // ← Apps Script 웹앱 배포 후 발급되는 URL을 여기에 넣으세요 (…/exec)
window.__PRE = {};
(function(){
  if(!GAS_URL || !window.fetch) return;
  function pre(action, data){
    var body = JSON.stringify(Object.assign({action:action}, data||{}));
    window.__PRE[action+'|'+JSON.stringify(data||{})] =
      fetch(GAS_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:body})
        .then(function(r){ return r.json(); })
        .catch(function(err){ return {ok:false, netError:true, error:'서버 연결 실패: '+err.message}; });
  }
  var d = new Date();
  var ym = d.getFullYear()+'-'+(d.getMonth()<9?'0':'')+(d.getMonth()+1);
  pre('getEmployees', {});
  pre('getAnnuals', {ym:ym});
  pre('getCalNotice', {});
  var pin = '';
  try{ pin = localStorage.getItem('sch_pin') || ''; }catch(e){}
  if(pin) pre('checkPin', {pin:pin});
})();
</script>
<style>
:root{--bg:#F7F8FA;--s:#FFF;--b:#E4E6EA;--bs:#C8CDD6;--tp:#1A1D23;--ts:#5A6170;--tm:#9BA3AF;--ac:#3B6FE8;--al:#EEF3FD;--ad:#2A52C4;--ok:#1D9E75;--okl:#E1F5EE;--wn:#BA7517;--wnl:#FAEEDA;--dg:#A32D2D;--dgl:#FCEBEB;--pp:#534AB7;--ppl:#EEEDFE;--r:10px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tp);min-height:100vh;font-size:15px;line-height:1.6;}
.topbar{background:var(--s);border-bottom:1px solid var(--b);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.tbrand{font-size:16px;font-weight:600;letter-spacing:-.3px;}
.rbg{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;display:none;}
.rbg.rb-super{background:var(--ppl);color:var(--pp);display:inline-block;}
.rbg.rb-admin{background:var(--al);color:var(--ac);display:inline-block;}
.tabnav{background:var(--s);border-bottom:1px solid var(--b);padding:0 24px;display:flex;overflow-x:auto;scrollbar-width:none;}
.tabnav::-webkit-scrollbar{display:none;}
.tbtn{padding:12px 16px;font-size:13px;font-weight:500;color:var(--tm);cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;transition:all .15s;font-family:inherit;white-space:nowrap;position:relative;top:1px;}
.tbtn:hover{color:var(--tp);}
.tbtn.active{color:var(--ac);border-bottom-color:var(--ac);}
.main{padding:24px;max-width:1100px;margin:0 auto;}
.sync-ind{position:fixed;right:14px;bottom:14px;z-index:200;background:var(--s);border:1px solid var(--b);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--tm);box-shadow:0 2px 8px rgba(0,0,0,.09);opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:none;}
.sync-ind.on{opacity:1;transform:translateY(0);}
.pg{display:none;}.pg.active{display:block;}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:16px;}
.cttl{font-size:15px;font-weight:600;}
.csub{font-size:12px;color:var(--tm);margin-top:2px;}
.chd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--r);font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:inherit;line-height:1;}
.btn-pr{background:var(--ac);color:#fff;}.btn-pr:hover{background:var(--ad);}
.btn-se{background:var(--bg);color:var(--tp);border:1.5px solid var(--b);}.btn-se:hover{border-color:var(--bs);}
.btn-ok{background:var(--ok);color:#fff;}.btn-ok:hover{background:#0F6E56;}
.btn-dg{background:var(--dgl);color:var(--dg);border:1.5px solid #F7C1C1;}
.btn-wn{background:var(--wnl);color:var(--wn);border:1.5px solid #FAC775;}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px;}
.btn-xs{padding:4px 8px;font-size:12px;border-radius:6px;}
.fg{margin-bottom:13px;}
.fg label{display:block;font-size:13px;font-weight:500;color:var(--ts);margin-bottom:5px;}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 13px;border:1.5px solid var(--b);border-radius:var(--r);font-size:14px;background:var(--bg);color:var(--tp);outline:none;font-family:inherit;transition:border-color .15s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--ac);background:#fff;}
.fg textarea{resize:vertical;min-height:70px;}
.al{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;display:flex;align-items:flex-start;gap:8px;}
.al-wn{background:var(--wnl);color:#633806;border:1px solid #FAC775;}
.empty{padding:24px;text-align:center;color:var(--tm);font-size:13px;}
/* 직원 관리 */
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.emp-card{background:var(--s);border:1.5px solid var(--b);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;}
.emp-card.retired{background:#F5F5F5;opacity:.75;}
.emp-top{display:flex;align-items:center;gap:10px;}
.emp-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.emp-name{font-size:14px;font-weight:700;}
.emp-team{font-size:12px;color:var(--tm);}
.emp-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.color-dot.sel{border-color:var(--tp);}
.color-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;}
/* 연차 달력 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-nav h3{font-size:16px;font-weight:600;}
.cal-nav-b{display:flex;gap:6px;}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--b);border:1px solid var(--b);border-radius:10px;overflow:hidden;}
.cal-dow{background:#F7F8FA;padding:7px 4px;text-align:center;font-size:11px;font-weight:600;color:var(--tm);}
.cal-day{background:var(--s);padding:6px 4px;min-height:110px;cursor:pointer;transition:background .1s;position:relative;}
.cal-day:hover{background:#F0F5FF;}
.cal-day.om{background:#FAFAFA;}
.cal-day.om .cdn{color:var(--tm);}
.cal-day.today{background:var(--al);}
.cal-day.today .cdn{color:var(--ac);font-weight:700;}
.cal-day.we .cdn{color:#D04040;}
.cal-day.hol .cdn{color:#D04040;font-weight:700;}
.cal-day.hol{background:#FFF8F8;}
.hol-name{font-size:9px;color:#D04040;font-weight:600;display:block;margin-bottom:2px;}
.cdn{font-size:12px;font-weight:500;margin-bottom:3px;display:block;}
.cal-chips{display:flex;flex-direction:column;gap:2px;}
.cc{font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;white-space:normal;word-break:keep-all;line-height:1.35;}
.cc-an{background:#FAEEDA;color:#854F0B;}
.cc-ham{background:#E1F5EE;color:#085041;}
.cc-hpm{background:#EEF3FD;color:#185FA5;}
.cc-h75am{background:#FDE8E8;color:#9B2226;}
.cc-h75pm{background:#FFF0DB;color:#8A5300;}
.cc-hham{background:#EEEDFE;color:#3C3489;}
.cc-hhpm{background:#EEEDFE;color:#3C3489;}
.cc-hw{background:#E8ECF7;color:#2A3A7A;}
.cc-gg{background:#E6F4EA;color:#1B6B3A;}
.cc-jt{background:#FFE8CC;color:#8A4B00;}
.cc-jg{background:#FFF3B0;color:#7A5D00;}
.cc-bg{background:#FDE2E2;color:#9B1C1C;}
.cc-mg{background:#3A3A3A;color:#fff;}
.cpop{display:none;position:fixed;background:var(--s);border:1.5px solid var(--b);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);padding:14px;min-width:230px;max-width:90vw;max-height:80vh;overflow-y:auto;z-index:400;}
.cpop.open{display:block;}
.cpop h4{font-size:13px;font-weight:600;margin-bottom:10px;}
.at-btn{padding:7px 12px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--b);background:var(--bg);text-align:left;font-family:inherit;transition:all .15s;display:block;width:100%;margin-bottom:5px;}
.at-btn:hover{border-color:var(--ac);background:var(--al);}
.at-btn.sel{border-color:var(--ac);background:var(--al);color:var(--ac);}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:399;}
.overlay.open{display:block;}
/* 변경이력 */
.log-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--b);font-size:13px;}
.log-row:last-child{border-bottom:none;}
.log-dt{color:var(--tm);font-size:11px;white-space:nowrap;}
.log-by{font-weight:600;color:var(--ac);white-space:nowrap;}
@media(max-width:640px){.main{padding:14px;}.topbar,.tabnav{padding:0 14px;}.cal-day{min-height:82px;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tbrand">🏢 영업부(시흥) 스케줄관리</div>
  <div class="topbar-r" style="display:flex;align-items:center;gap:10px">
    <span id="role-badge" class="rbg"></span>
    <button class="btn btn-se btn-sm" id="admin-mode-btn" onclick="openPinPop()">🔒 관리자모드</button>
    <button class="btn btn-se btn-sm" id="admin-logout-btn" style="display:none" onclick="doLogout()">로그아웃</button>
  </div>
</div>
<div class="tabnav">
  <button class="tbtn active" data-tab="cal">📅 연차&amp;휴일근무</button>
  <button class="tbtn" data-tab="emp">👥 직원관리</button>
  <button class="tbtn" data-tab="log">🕓 변경이력</button>
</div>

<div class="main">

  <!-- ── 연차 달력 ── -->
  <div class="pg active" id="pg-cal">
    <div class="card" id="cal-notice-card">
      <div id="cal-notice-view" style="font-size:13px;color:#633806;line-height:1.8"></div>
      <div id="cal-notice-edit" style="display:none">
        <textarea id="cal-notice-ta" rows="4" style="width:100%;padding:10px;border:1.5px solid var(--b);border-radius:8px;font-size:13px;font-family:inherit"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn btn-pr btn-sm" onclick="saveCalNotice()">저장</button>
          <button class="btn btn-se btn-sm" onclick="cancelCalNoticeEdit()">취소</button>
        </div>
      </div>
      <button class="btn btn-se btn-xs" id="cal-notice-edit-btn" style="margin-top:8px" onclick="openCalNoticeEdit()">✏️ 공지 수정</button>
    </div>

    <div class="card">
      <div class="cal-nav">
        <h3 id="cal-ttl">-</h3>
        <div class="cal-nav-b">
          <button class="btn btn-se btn-sm" onclick="moveCal(-1)">‹ 이전달</button>
          <button class="btn btn-se btn-sm" onclick="moveCal(0)">오늘</button>
          <button class="btn btn-se btn-sm" onclick="moveCal(1)">다음달 ›</button>
        </div>
      </div>
      <div class="cal-legend">
        <span class="cc cc-an">연차</span>
        <span class="cc cc-ham">오전반차</span>
        <span class="cc cc-hpm">오후반차</span>
        <span class="cc cc-h75am">0.75차(12시퇴근)</span>
        <span class="cc cc-h75pm">0.75차(17시출근)</span>
        <span class="cc cc-hham">오전반반차</span>
        <span class="cc cc-hhpm">오후반반차</span>
        <span class="cc cc-hw">휴일근무(토/일)</span>
        <span class="cc cc-gg">공가(예비군)</span>
        <span class="cc cc-jt">조퇴</span>
        <span class="cc cc-jg">지각</span>
        <span class="cc cc-bg">병가</span>
        <span class="cc cc-mg">무단결근</span>
      </div>
      <p style="font-size:12px;color:var(--tm);margin-bottom:10px">※ 날짜 클릭 → 직원 선택 후 연차/휴일근무 등록</p>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>

  <!-- ── 직원관리 ── -->
  <div class="pg" id="pg-emp">
    <div class="card" id="emp-add-card">
      <div class="chd">
        <div>
          <div class="cttl">직원 등록</div>
          <div class="csub">이름 / 구분색 / 팀을 입력해주세요</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="fg" style="margin-bottom:0">
          <label>이름</label>
          <input id="ne-name" placeholder="이름 입력">
        </div>
        <div class="fg" style="margin-bottom:0">
          <label>팀</label>
          <input id="ne-team" placeholder="예) 유통1팀 (선택)">
        </div>
      </div>
      <div class="fg">
        <label>구분색</label>
        <div class="color-row" id="ne-color-row"></div>
      </div>
      <button class="btn btn-pr" onclick="submitAddEmp()">+ 직원 등록</button>
    </div>
    <div class="al al-wn" id="emp-noauth-msg" style="display:none">🔒 직원 등록/수정/퇴사·복직/삭제는 슈퍼관리자만 가능합니다. 상단의 '관리자모드'로 로그인해주세요.</div>

    <div class="card">
      <div class="chd">
        <div class="cttl">직원 목록</div>
        <div class="csub" id="emp-count">-</div>
      </div>
      <div class="emp-grid" id="emp-list"></div>
    </div>
  </div>

  <!-- ── 변경이력 ── -->
  <div class="pg" id="pg-log">
    <div class="card">
      <div class="chd"><div class="cttl">변경이력</div><div class="csub">최근 60일</div></div>
      <div id="log-list"></div>
    </div>
  </div>

</div>

<!-- 관리자모드 PIN 입력 팝업 -->
<div class="overlay" id="pin-overlay" onclick="closePinPop()"></div>
<div class="cpop" id="pin-pop" style="left:50%;top:80px;transform:translateX(-50%);min-width:260px">
  <h4>관리자모드 - 비밀번호 입력</h4>
  <div class="fg" style="margin-bottom:10px">
    <input id="pin-input" type="password" placeholder="비밀번호(PIN)" inputmode="numeric" onkeydown="if(event.key==='Enter') submitPin();">
  </div>
  <div id="pin-err" style="color:var(--dg);font-size:12px;margin-bottom:8px;display:none">비밀번호가 올바르지 않습니다.</div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn btn-se btn-sm" onclick="closePinPop()">취소</button>
    <button class="btn btn-pr btn-sm" onclick="submitPin()">확인</button>
  </div>
</div>

<!-- 직원 수정 팝업 -->
<div class="overlay" id="emp-overlay" onclick="closeEmpEdit()"></div>
<div class="cpop" id="emp-edit-pop" style="left:50%;top:80px;transform:translateX(-50%);min-width:280px">
  <h4>직원 정보 수정</h4>
  <div class="fg"><label>이름</label><input id="ee-name"></div>
  <div class="fg"><label>팀</label><input id="ee-team"></div>
  <div class="fg"><label>구분색</label><div class="color-row" id="ee-color-row"></div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
    <button class="btn btn-se btn-sm" onclick="closeEmpEdit()">취소</button>
    <button class="btn btn-pr btn-sm" onclick="submitEditEmp()">저장</button>
  </div>
</div>

<!-- 연차 등록 팝업 -->
<div class="sync-ind" id="sync-ind">동기화 중…</div>

<div class="cpop" id="cpop">
  <h4 id="cpop-lbl">날짜 선택</h4>
  <div id="cpop-emp-wrap" style="margin-bottom:8px">
    <select id="cpop-emp-sel" style="width:100%;padding:6px 8px;border:1.5px solid var(--b);border-radius:6px;font-size:13px;font-family:inherit;outline:none;background:var(--s)"></select>
  </div>
  <div id="cpop-types"></div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn btn-dg btn-xs" id="cpop-del" style="display:none">삭제</button>
    <button class="btn btn-se btn-xs" style="margin-left:auto" onclick="closeCPop()">닫기</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
//  설정  (GAS_URL은 <head>의 선행 요청 스크립트에 있습니다)
// ══════════════════════════════════════════════════════════
var EMP_COLORS = ['#3B6FE8','#1D9E75','#BA7517','#534AB7','#A32D2D','#0891B2','#C2410C','#7C3AED','#65A30D','#DB2777'];

var ATYPES = [
  {k:'연차', l:'연차 (종일)', c:'cc-an'},
  {k:'오전반차', l:'오전반차', c:'cc-ham'},
  {k:'오후반차', l:'오후반차', c:'cc-hpm'},
  {k:'0.75차(12시퇴근)', l:'0.75차(12시퇴근)', c:'cc-h75am'},
  {k:'0.75차(17시출근)', l:'0.75차(17시출근)', c:'cc-h75pm'},
  {k:'오전반반차', l:'오전반반차', c:'cc-hham'},
  {k:'오후반반차', l:'오후반반차', c:'cc-hhpm'},
  {k:'휴일근무', l:'휴일근무', c:'cc-hw', weekendOnly:true},
  {k:'공가(예비군)', l:'공가(예비군)', c:'cc-gg'},
  {k:'조퇴', l:'조퇴', c:'cc-jt'},
  {k:'지각', l:'지각', c:'cc-jg'},
  {k:'병가', l:'병가', c:'cc-bg'},
  {k:'무단결근', l:'무단결근', c:'cc-mg'}
];

var KR_HOLIDAYS = {
  '2024-01-01':1,'2024-02-09':1,'2024-02-10':1,'2024-02-11':1,'2024-02-12':1,
  '2024-03-01':1,'2024-04-10':1,'2024-05-05':1,'2024-05-06':1,'2024-05-15':1,
  '2024-06-06':1,'2024-08-15':1,'2024-09-16':1,'2024-09-17':1,'2024-09-18':1,
  '2024-10-03':1,'2024-10-09':1,'2024-12-25':1,
  '2025-01-01':1,'2025-01-28':1,'2025-01-29':1,'2025-01-30':1,
  '2025-03-01':1,'2025-05-05':1,'2025-05-06':1,'2025-05-15':1,

// ══════════════════════════════════════════════════════════
//  API 레이어 — 캐시 / 중복요청 제거 / 병렬 / 타임아웃
//  GAS(Apps Script) 호출은 1회당 수백ms~수초가 걸린다.
//  ① 직렬 호출을 없애 전부 동시에 쏘고
//  ② 같은 요청은 합치고
//  ③ 이전 응답을 캐시해 화면을 먼저 그린 뒤 뒤에서 갱신한다.
// ══════════════════════════════════════════════════════════
var CACHE_NS = 'sch_cache_v1:';
var CACHE_MEM = {};
var INFLIGHT = {};
var READ_ACTIONS = {getEmployees:1, getAnnuals:1, getCalNotice:1, getChangeLogs:1, checkPin:1};
var API_TIMEOUT = 20000;   // GAS 무응답 시 무한 대기 방지
var SWR_TTL = 15000;       // 이 시간 안에 받은 캐시는 재요청 생략

function ckey(action, data){ return action+'|'+JSON.stringify(data||{}); }

function cacheGet(key){
  if(CACHE_MEM[key]) return CACHE_MEM[key];
  try{
    var raw = localStorage.getItem(CACHE_NS+key);
    if(raw){ var o=JSON.parse(raw); if(o && o.v){ CACHE_MEM[key]=o; return o; } }
  }catch(e){}
  return null;
}
function cacheSet(key, value){
  var o = {t:Date.now(), v:value};
  CACHE_MEM[key] = o;
  try{ localStorage.setItem(CACHE_NS+key, JSON.stringify(o)); }catch(e){}
}
function cacheClear(prefix){
  Object.keys(CACHE_MEM).forEach(function(k){ if(k.indexOf(prefix)===0) delete CACHE_MEM[k]; });
  try{
    for(var i=localStorage.length-1;i>=0;i--){
      var k=localStorage.key(i);
      if(k && k.indexOf(CACHE_NS+prefix)===0) localStorage.removeItem(k);
    }
  }catch(e){}
}

var PENDING = 0;
function setPending(d){
  PENDING = Math.max(0, PENDING+d);
  var el = document.getElementById('sync-ind');
  if(el) el.className = 'sync-ind'+(PENDING>0 ? ' on' : '');
}

function rawApi(action, data){
  if(!GAS_URL){
    alert('GAS_URL이 설정되지 않았습니다. index.html 상단의 GAS_URL 값을 Apps Script 배포 URL로 채워주세요.');
    return Promise.resolve({ok:false, error:'GAS_URL 미설정'});
  }
  // <head>에서 미리 쏴둔 요청이 있으면 그대로 재사용 (스크립트 파싱 대기 0)
  var key = ckey(action, data);
  if(window.__PRE && window.__PRE[key]){
    var pre = window.__PRE[key];
    delete window.__PRE[key];
    return pre;
  }
  var ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var timer = ctl ? setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, API_TIMEOUT) : 0;
  return fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action:action}, data||{})),
    signal: ctl ? ctl.signal : undefined
  }).then(function(r){ return r.json(); })
    .then(function(j){ if(timer) clearTimeout(timer); return j; })
    .catch(function(e){
      if(timer) clearTimeout(timer);
      return {ok:false, netError:true,
        error:(e && e.name==='AbortError') ? '서버 응답이 너무 느립니다 (시간 초과)' : '서버 연결 실패: '+e.message};
    });
}

// 동일한 조회 요청이 이미 날아가 있으면 그 결과를 같이 쓴다.
function api(action, data){
  var key = ckey(action, data);
  if(READ_ACTIONS[action] && INFLIGHT[key]) return INFLIGHT[key];
  setPending(1);
  var p = rawApi(action, data).then(function(r){
    setPending(-1);
    delete INFLIGHT[key];
    return r;
  });
  if(READ_ACTIONS[action]) INFLIGHT[key] = p;
  return p;
}

// stale-while-revalidate: 캐시가 있으면 즉시 onData(값,false),
// 서버 응답이 달라지면 onData(값,true)로 한 번 더.
function apiSWR(action, data, onData, ttl){
  var key = ckey(action, data);
  var c = cacheGet(key);
  var servedJson = null;
  if(c){
    servedJson = JSON.stringify(c.v);
    try{ onData(c.v, false); }catch(e){}
    if(ttl && (Date.now()-c.t) < ttl) return Promise.resolve(c.v);
  }
  return api(action, data).then(function(r){
    if(r && r.ok){
      var s = JSON.stringify(r);
      cacheSet(key, r);
      if(s !== servedJson){ try{ onData(r, true); }catch(e){} }
    } else if(!c){
      try{ onData(r, true); }catch(e){}
    }
    return r;
  });
}

function pad2(n){ return (n<10?'0':'')+n; }
function ymdLocal(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtLocal(d){ return ymdLocal(d)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }
function dateOf(ds){ return new Date(ds+'T00:00:00'); }   // 로컬 기준 파싱 (UTC 밀림 방지)
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var ROLE = null; // null | 'admin' | 'super'

function refreshRoleUI(){
  var badge = document.getElementById('role-badge');
  var modeBtn = document.getElementById('admin-mode-btn');
  var logoutBtn = document.getElementById('admin-logout-btn');
  if(ROLE==='super'){
    badge.textContent='슈퍼관리자'; badge.className='rbg rb-super';
    modeBtn.style.display='none'; logoutBtn.style.display='inline-flex';
  } else if(ROLE==='admin'){
    badge.textContent='관리자'; badge.className='rbg rb-admin';
    modeBtn.style.display='none'; logoutBtn.style.display='inline-flex';
  } else {
    badge.textContent=''; badge.className='rbg';
    modeBtn.style.display='inline-flex'; logoutBtn.style.display='none';
  }
  renderEmpList();
  renderCalNotice();
}
function initRole(){
  var pin = currentPin();
  if(!pin){ ROLE=null; refreshRoleUI(); return; }
  // 캐시된 권한으로 즉시 UI 복원 → 서버 확인은 뒤에서
  apiSWR('checkPin', {pin:pin}, function(r){
    ROLE = (r && r.ok) ? r.role : null;
    // 네트워크 장애로 실패한 경우엔 PIN을 지우지 않는다 (오탈퇴 방지)
    if(r && !r.ok && !r.netError) localStorage.removeItem('sch_pin');
    refreshRoleUI();
  });
}

  document.getElementById('pin-pop').classList.add('open');

}
function closePinPop(){

}
function submitPin(){
  var pin = document.getElementById('pin-input').value.trim();
  if(!pin) return;
  api('checkPin', {pin:pin}).then(function(r){
    if(r.ok){
      localStorage.setItem('sch_pin', pin);

      ROLE = r.role;
      closePinPop();
      refreshRoleUI();
    } else {
      var errEl = document.getElementById('pin-err');
      errEl.textContent = r.netError ? (r.error||'서버 연결 실패') : '비밀번호가 올바르지 않습니다.';
      errEl.style.display='block';
    }
  });
}
function doLogout(){
  localStorage.removeItem('sch_pin');
  cacheClear('checkPin');
  ROLE = null;
  refreshRoleUI();
}

function setEmployees(list){
  EMPLOYEES = list || [];
  EMP_MAP = {};
  EMPLOYEES.forEach(function(e){ EMP_MAP[e.id] = e; });
  EMP_LOADED = true;
}
function empName(id){ var e=EMP_MAP[id]; return e?e.name:''; }
function empColor(id){ var e=EMP_MAP[id]; return e?(e.color||'#3B6FE8'):'#3B6FE8'; }

// 캐시가 있으면 즉시 그리고, 서버 값이 달라질 때만 다시 그린다.
function loadEmployees(force){
  return apiSWR('getEmployees', {}, function(r){
    if(r && r.ok){ setEmployees(r.employees); renderEmpList(); renderCal(); }
    else if(!EMP_LOADED){ EMP_LOADED = true; renderEmpList(); }
  }, force ? 0 : SWR_TTL);
}
function commitEmployees(list){   // 낙관적 수정분을 캐시에도 반영
  setEmployees(list);
  cacheSet(ckey('getEmployees',{}), {ok:true, employees:list});
}

function buildColorRow(container, selected, onPick){
  container.innerHTML='';
  EMP_COLORS.forEach(function(c){
    var d=document.createElement('div');
    d.className='color-dot'+(c===selected?' sel':'');
    d.style.background=c;
    d.addEventListener('click', function(){
      container.querySelectorAll('.color-dot').forEach(function(x){x.classList.remove('sel');});
      d.classList.add('sel');
      onPick(c);
    });
    container.appendChild(d);
  });
}
var NEW_EMP_COLOR = EMP_COLORS[0];
buildColorRow(document.getElementById('ne-color-row'), NEW_EMP_COLOR, function(c){ NEW_EMP_COLOR=c; });

function submitAddEmp(){
  if(!isSuper()){ alert('슈퍼관리자만 직원을 등록할 수 있습니다.'); return; }
  var name = document.getElementById('ne-name').value.trim();
  var team = document.getElementById('ne-team').value.trim();
  if(!name){ alert('이름을 입력해주세요.'); return; }
  api('addEmployee', {pin:currentPin(), emp:{name:name, team:team, color:NEW_EMP_COLOR}}).then(function(r){
    if(r.ok){
      document.getElementById('ne-name').value='';
      document.getElementById('ne-team').value='';
      addLog('직원 등록: '+name);
      cacheClear('getEmployees');
      loadEmployees(true);   // id는 서버가 발급하므로 이때만 재조회
    } else alert(r.error||'등록 실패');
  });
}

function renderEmpList(){
  var canEdit = isSuper();
  document.getElementById('emp-add-card').style.display = canEdit ? '' : 'none';
  document.getElementById('emp-noauth-msg').style.display = canEdit ? 'none' : 'flex';
  var list = document.getElementById('emp-list');
  document.getElementById('emp-count').textContent = EMPLOYEES.length+'명';
  if(!EMPLOYEES.length){
    list.innerHTML = EMP_LOADED ? '<div class="empty">등록된 직원이 없습니다.</div>' : '<div class="empty">불러오는 중…</div>';
    return;
  }
  var sorted = EMPLOYEES.slice().sort(function(a,b){
    var ra=a.retired?1:0, rb=b.retired?1:0;
    if(ra!==rb) return ra-rb;
    return (a.name||'').localeCompare(b.name||'');
  });
  list.innerHTML = sorted.map(function(e){
    var initial = esc((e.name||'?').replace(/^\(퇴\)/,'').slice(0,1));
    return '<div class="emp-card'+(e.retired?' retired':'')+'">'+
      '<div class="emp-top">'+
        '<div class="emp-avatar" style="background:'+esc(e.color||'#3B6FE8')+'">'+initial+'</div>'+
        '<div><div class="emp-name">'+esc(e.name)+'</div><div class="emp-team">'+(e.retired?('퇴사일 '+esc(e.retiredAt||'-')) : esc(e.team||'팀 미지정'))+'</div></div>'+
      '</div>'+
      (canEdit ? (
      '<div class="emp-actions" data-id="'+esc(e.id)+'">'+
        '<button class="btn btn-se btn-xs" data-act="edit">수정</button>'+
        (e.retired
          ? '<button class="btn btn-ok btn-xs" data-act="unretire">복직처리</button>'
          : '<button class="btn btn-wn btn-xs" data-act="retire">퇴사처리</button>')+
        '<button class="btn btn-dg btn-xs" data-act="del">삭제</button>'+
      '</div>') : '')+
    '</div>';
  }).join('');
}
// 이벤트 위임 — 목록을 다시 그려도 핸들러를 새로 달지 않는다.
document.getElementById('emp-list').addEventListener('click', function(ev){
  var btn = ev.target.closest ? ev.target.closest('button[data-act]') : null;
  if(!btn) return;
  var id = btn.parentNode.getAttribute('data-id');
  var name = empName(id);
  var act = btn.getAttribute('data-act');
  if(act==='edit') openEmpEdit(id);
  else if(act==='retire') doRetire(id, name);
  else if(act==='unretire') doUnretire(id, name);
  else if(act==='del') doDeleteEmp(id, name);
});

// 서버 응답을 기다리지 않고 화면부터 바꾸고, 실패하면 되돌린다.
function empWrite(action, payload, mutate, logDesc, failMsg){
  var before = EMPLOYEES.map(function(e){ return Object.assign({}, e); });
  commitEmployees(mutate(before.map(function(e){ return Object.assign({}, e); })));
  renderEmpList(); renderCal();
  api(action, payload).then(function(r){
    if(r.ok){
      addLog(logDesc);
      cacheClear('getEmployees');
      loadEmployees(true);   // 서버가 확정한 값으로 조용히 맞춘다
    }
    else {
      commitEmployees(before);
      renderEmpList(); renderCal();
      alert(r.error||failMsg);
    }
  });
}

function doRetire(id, name){
  if(!isSuper()) return;
  if(!confirm(name+' 님을 퇴사 처리하시겠습니까?\n\n· 기존 연차 기록은 그대로 유지됩니다.\n· 표시 이름 앞에 "(퇴)"가 붙습니다.')) return;
  empWrite('retireEmployee', {pin:currentPin(), id:id}, function(list){
    return list.map(function(e){
      if(e.id===id){ e.retired=true; e.retiredAt=e.retiredAt||ymdLocal(new Date()); if(!/^\(퇴\)/.test(e.name||'')) e.name='(퇴)'+e.name; }
      return e;
    });
  }, '퇴사 처리: '+name, '처리 실패');
}
function doUnretire(id, name){
  if(!isSuper()) return;
  if(!confirm(name.replace(/^\(퇴\)/,'')+' 님을 복직 처리하시겠습니까?')) return;
  empWrite('unretireEmployee', {pin:currentPin(), id:id}, function(list){
    return list.map(function(e){
      if(e.id===id){ e.retired=false; e.retiredAt=''; e.name=(e.name||'').replace(/^\(퇴\)/,''); }
      return e;
    });
  }, '복직 처리: '+name, '처리 실패');
}
function doDeleteEmp(id, name){
  if(!isSuper()) return;
  if(!confirm(name+' 님을 목록에서 완전히 삭제하시겠습니까?\n(연차 기록은 삭제되지 않고 남아있습니다)')) return;
  empWrite('deleteEmployee', {pin:currentPin(), id:id}, function(list){
    return list.filter(function(e){ return e.id!==id; });
  }, '직원 삭제: '+name, '삭제 실패');
}

var _editEmpId = null, _editEmpColor = null;
function openEmpEdit(id){
  if(!isSuper()) return;
  var e = EMP_MAP[id];
  if(!e) return;
  _editEmpId = id; _editEmpColor = e.color || EMP_COLORS[0];
  document.getElementById('ee-name').value = e.name || '';
  document.getElementById('ee-team').value = e.team || '';
  buildColorRow(document.getElementById('ee-color-row'), _editEmpColor, function(c){ _editEmpColor=c; });
  document.getElementById('emp-overlay').classList.add('open');
  document.getElementById('emp-edit-pop').classList.add('open');
}
function closeEmpEdit(){
  document.getElementById('emp-overlay').classList.remove('open');
  document.getElementById('emp-edit-pop').classList.remove('open');
}
function submitEditEmp(){
  if(!isSuper()) return;
  var name = document.getElementById('ee-name').value.trim();
  var team = document.getElementById('ee-team').value.trim();
  if(!name){ alert('이름을 입력해주세요.'); return; }
  var id = _editEmpId, color = _editEmpColor;
  closeEmpEdit();
  empWrite('updateEmployee', {pin:currentPin(), id:id, fields:{name:name, team:team, color:color}}, function(list){
    return list.map(function(e){
      if(e.id===id){ e.name=name; e.team=team; e.color=color; }
      return e;
    });
  }, '직원 정보 수정: '+name, '저장 실패');
}

var cY=new Date().getFullYear(), cM=new Date().getMonth();
var cAn=[];
var ANNUALS={};          // ym -> annuals[]  (월 이동 시 재요청 없이 즉시 표시)
var CAL_LOADED={};
var popDate=null;

function curYM(){ return cY+'-'+pad2(cM+1); }
function moveCal(d){
  if(d===0){ cY=new Date().getFullYear(); cM=new Date().getMonth(); }
  else{ cM+=d; if(cM<0){cM=11;cY--;} if(cM>11){cM=0;cY++;} }
  loadCal();
}
function loadCal(){
  var ym = curYM();
  document.getElementById('cal-ttl').textContent = cY+'년 '+(cM+1)+'월';
  cAn = ANNUALS[ym] || [];
  renderCal();                                   // 응답을 기다리지 않고 먼저 그린다
  apiSWR('getAnnuals', {ym:ym}, function(r){
    if(r && r.ok){
      ANNUALS[ym] = r.annuals || [];
      CAL_LOADED[ym] = true;
      if(curYM()===ym){ cAn = ANNUALS[ym]; renderCal(); }
    }
  }, SWR_TTL).then(function(){ prefetchNeighbors(cY, cM); });
}
// 앞뒤 달을 미리 받아둬 화살표 이동이 즉시 반응하게 한다.
function prefetchNeighbors(y, m){
  [[y, m-1],[y, m+1]].forEach(function(p){
    var yy=p[0], mm=p[1];
    if(mm<0){ mm=11; yy--; } if(mm>11){ mm=0; yy++; }
    var ym = yy+'-'+pad2(mm+1);
    if(ANNUALS[ym]) return;
    apiSWR('getAnnuals', {ym:ym}, function(r){
      if(r && r.ok){ ANNUALS[ym]=r.annuals||[]; CAL_LOADED[ym]=true; if(curYM()===ym){ cAn=ANNUALS[ym]; renderCal(); } }
    }, SWR_TTL);
  });
}
function commitAnnuals(ym, list){
  ANNUALS[ym] = list;
  cacheSet(ckey('getAnnuals',{ym:ym}), {ok:true, annuals:list});
}

function renderCal(){
  var idx = {};
  cAn.forEach(function(a){ (idx[a.date]=idx[a.date]||[]).push(a); });
  var today = ymdLocal(new Date());
  var first = new Date(cY,cM,1).getDay();
  var last  = new Date(cY,cM+1,0).getDate();
  var prevLast = new Date(cY,cM,0).getDate();
  var ymP = cM===0 ? (cY-1)+'-12' : cY+'-'+pad2(cM);
  var ymC = curYM();
  var ymN = cM===11 ? (cY+1)+'-01' : cY+'-'+pad2(cM+2);
  var html = '<div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div>'+
             '<div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow">토</div>';
  for(var i=first-1;i>=0;i--){ var pd=prevLast-i; html += dayHtml(ymP+'-'+pad2(pd), pd, true, today, idx); }
  for(var d=1; d<=last; d++){ html += dayHtml(ymC+'-'+pad2(d), d, false, today, idx); }
  var used=first+last, rem = used%7===0 ? 0 : 7-(used%7);
  for(var n=1; n<=rem; n++) html += dayHtml(ymN+'-'+pad2(n), n, true, today, idx);
  document.getElementById('cal-grid').innerHTML = html;   // 42셀 한 번에 반영
}
function dayHtml(ds, dayNum, other, today, idx){
  var dow = dateOf(ds).getDay();
  var hol = isHoliday(ds);
  var cls = 'cal-day'+(other?' om':'')+(ds===today?' today':'')+(dow===0||dow===6?' we':'')+(hol?' hol':'');
  var h = '<div class="'+cls+'" data-ds="'+ds+'"><span class="cdn">'+dayNum+'</span>';
  if(hol && !other) h += '<span class="hol-name">'+esc(HOL_NAMES[ds.slice(5)] || '공휴일')+'</span>';
  h += '<div class="cal-chips">';
  var arr = idx[ds];
  if(arr) for(var i=0;i<arr.length;i++){
    var a = arr[i];
    var t = ATYPE_MAP[a.type] || {c:'cc-an'};
    var nm = esc(empName(a.empId) || a.empName)+' '+esc(a.type);
    h += '<div class="cc '+t.c+'" title="'+nm+'">'+nm+'</div>';
  }
  return h+'</div></div>';
}
document.getElementById('cal-grid').addEventListener('click', function(e){
  var cell = e.target.closest ? e.target.closest('.cal-day') : null;
  if(cell) openCPop(cell.getAttribute('data-ds'), e);
});

function openCPop(date, e){
  e.stopPropagation();
  popDate = date;
  var pop = document.getElementById('cpop');
  var empWrap = document.getElementById('cpop-emp-wrap');

  if(!isAdminUp()){
    // 권한 없음 — 조회 전용
    empWrap.style.display='none';
    document.getElementById('cpop-lbl').textContent = date+' - 연차 현황';
    document.getElementById('cpop-del').style.display='none';
    var tc = document.getElementById('cpop-types');
    var dayAnns = cAn.filter(function(a){return a.date===date;});
    tc.innerHTML = (dayAnns.length
      ? '<div style="font-size:12px;color:var(--ts);line-height:1.8">'+dayAnns.map(function(a){return '<div>'+esc(empName(a.empId)||a.empName)+' — '+esc(a.type)+'</div>';}).join('')+'</div>'
      : '<div style="font-size:12px;color:var(--tm)">등록된 내역이 없습니다.</div>')
      + '<div style="font-size:11px;color:var(--tm);margin-top:8px">⚠️ 등록/변경은 관리자모드에서만 가능합니다.</div>';
    openPopAt(pop, e);
    return;
  }

  empWrap.style.display='block';
  var empSel = document.getElementById('cpop-emp-sel');
  var prev = empSel.value;
  var activeEmps = EMPLOYEES.filter(function(u){return !u.retired;})
    .sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
  empSel.innerHTML = activeEmps.map(function(u){return '<option value="'+esc(u.id)+'">'+esc(u.name)+'</option>';}).join('');
  if(prev && EMP_MAP[prev] && !EMP_MAP[prev].retired) empSel.value = prev;   // 직전 선택 유지
  empSel.onchange = function(){ refreshCPopState(date); };
  refreshCPopState(date);
  openPopAt(pop, e);
}
function openPopAt(pop, e){
  pop.style.left='-9999px'; pop.style.top='-9999px';
  pop.classList.add('open'); // 먼저 표시해야 실제 크기를 측정할 수 있음
  var margin=8, w=pop.offsetWidth||240, h=pop.offsetHeight||300;
  var x=e.clientX+margin, y=e.clientY+margin;
  if(x+w>window.innerWidth) x=e.clientX-w-margin;
  if(y+h>window.innerHeight) y=Math.max(8, window.innerHeight-h-margin);
  if(x<8) x=8;
  pop.style.left=x+'px'; pop.style.top=y+'px';
}
function refreshCPopState(date){
  var empSel = document.getElementById('cpop-emp-sel');
  var targetId = empSel.value;
  var tc = document.getElementById('cpop-types');
  document.getElementById('cpop-lbl').textContent = date+' - 연차/휴일근무 등록';
  var exist = cAn.find(function(a){return a.empId===targetId && a.date===date;});
  document.getElementById('cpop-del').style.display = exist ? 'inline-flex' : 'none';
  var others = cAn.filter(function(a){return a.date===date && a.empId!==targetId;});
  var html = '';
  if(others.length){
    html += '<div style="font-size:12px;color:var(--ts);margin-bottom:8px;line-height:1.8">'+
      others.map(function(a){return '<div>'+esc(empName(a.empId)||a.empName)+' — '+esc(a.type)+'</div>';}).join('')+'</div>';
  }
  ATYPES.filter(function(t){return !t.weekendOnly || isWeekend(date);}).forEach(function(t){
    html += '<button class="at-btn'+(exist && exist.type===t.k ? ' sel' : '')+'" data-k="'+esc(t.k)+'">'+esc(t.l)+'</button>';
  });
  tc.innerHTML = html;
}
document.getElementById('cpop-types').addEventListener('click', function(e){
  var btn = e.target.closest ? e.target.closest('button[data-k]') : null;
  if(btn) saveAnnualType(btn.getAttribute('data-k'));
});
function closeCPop(){ document.getElementById('cpop').classList.remove('open'); }

// 저장/삭제는 화면을 먼저 갱신하고(낙관적 반영) 실패 시 되돌린다.
function saveAnnualType(type){
  if(!isAdminUp()) return;
  if(!popDate){ alert('날짜를 다시 선택해주세요.'); return; }
  var empSel = document.getElementById('cpop-emp-sel');
  var id = empSel.value;
  if(!id){ alert('직원을 선택해주세요.'); return; }
  var name = empName(id), date = popDate, ym = date.slice(0,7);
  var before = (ANNUALS[ym]||cAn).slice();
  var next = before.filter(function(a){return !(a.empId===id && a.date===date);});
  next.push({empId:id, empName:name, date:date, type:type});
  commitAnnuals(ym, next);
  if(curYM()===ym){ cAn = next; renderCal(); }
  closeCPop();
  api('saveAnnual', {pin:currentPin(), a:{empId:id, empName:name, date:date, type:type}}).then(function(res){
    if(res.ok){ addLog(name+' '+date+' '+type+' 등록'); }
    else{
      commitAnnuals(ym, before);
      if(curYM()===ym){ cAn = before; renderCal(); }
      alert(res.error||'저장 실패');
    }
  });
}
function deleteAnnual(){
  if(!isAdminUp()) return;
  if(!confirm('등록된 연차/휴일근무를 삭제하시겠습니까?')) return;
  if(!popDate) return;
  var empSel = document.getElementById('cpop-emp-sel');
  var id = empSel.value;
  var name = empName(id), date = popDate, ym = date.slice(0,7);
  var before = (ANNUALS[ym]||cAn).slice();
  var next = before.filter(function(a){return !(a.empId===id && a.date===date);});
  commitAnnuals(ym, next);
  if(curYM()===ym){ cAn = next; renderCal(); }
  closeCPop();
  api('saveAnnual', {pin:currentPin(), a:{empId:id, empName:name, date:date, type:''}}).then(function(res){
    if(res.ok){ addLog(name+' '+date+' 연차/휴일근무 삭제'); }
    else{
      commitAnnuals(ym, before);
      if(curYM()===ym){ cAn = before; renderCal(); }
      alert(res.error||'삭제 실패');
    }
  });
}
document.getElementById('cpop-del').addEventListener('click', deleteAnnual);
document.addEventListener('click', function(e){
  var pop = document.getElementById('cpop');
  if(pop.classList.contains('open') && !pop.contains(e.target)) closeCPop();
});

// ══════════════════════════════════════════════════════════
//  연차 공지
// ══════════════════════════════════════════════════════════
var CAL_NOTICE = '';
function renderCalNotice(){
  document.getElementById('cal-notice-edit-btn').style.display = isAdminUp() ? 'inline-flex' : 'none';
  var viewEl = document.getElementById('cal-notice-view');
  if(!CAL_NOTICE.trim()){
    viewEl.innerHTML = isAdminUp() ? '<span style="color:#C0955A">공지사항을 입력해주세요.</span>' : '';
  } else {
    viewEl.innerHTML = CAL_NOTICE.split('\n').map(function(l){return '<div>'+(esc(l)||'&nbsp;')+'</div>';}).join('');
  }
}
function loadCalNotice(force){
  return apiSWR('getCalNotice', {}, function(res){
    CAL_NOTICE = (res && res.ok) ? (res.notice||'') : '';
    renderCalNotice();
  }, force ? 0 : SWR_TTL);
}
function openCalNoticeEdit(){
  document.getElementById('cal-notice-ta').value = CAL_NOTICE;
  document.getElementById('cal-notice-view').style.display='none';
  document.getElementById('cal-notice-edit').style.display='block';
  document.getElementById('cal-notice-edit-btn').style.display='none';
}
function cancelCalNoticeEdit(){
  document.getElementById('cal-notice-view').style.display='block';
  document.getElementById('cal-notice-edit').style.display='none';
  document.getElementById('cal-notice-edit-btn').style.display='inline-flex';
}
function saveCalNotice(){
  if(!isAdminUp()) return;
  var notice = document.getElementById('cal-notice-ta').value.trim();
  var before = CAL_NOTICE;
  CAL_NOTICE = notice;
  cacheSet(ckey('getCalNotice',{}), {ok:true, notice:notice});
  cancelCalNoticeEdit();
  renderCalNotice();
  api('saveCalNotice', {pin:currentPin(), notice:notice}).then(function(res){
    if(res.ok){ addLog('연차 공지 수정'); }
    else{
      CAL_NOTICE = before;
      cacheSet(ckey('getCalNotice',{}), {ok:true, notice:before});
      renderCalNotice();
      alert(res.error||'저장 실패');
    }
  });
}

// ══════════════════════════════════════════════════════════
//  변경이력
// ══════════════════════════════════════════════════════════
function loadLogs(){
  apiSWR('getChangeLogs', {days:60}, function(r){
    var list = document.getElementById('log-list');
    if(!r || !r.ok || !r.logs || !r.logs.length){ list.innerHTML='<div class="empty">변경이력이 없습니다.</div>'; return; }
    list.innerHTML = r.logs.map(function(l){
      return '<div class="log-row"><div class="log-dt">'+esc(l.dt||'')+'</div><div>'+esc(l.desc||'')+'</div></div>';
    }).join('');
  }, SWR_TTL);
}

// ══════════════════════════════════════════════════════════
//  초기화 — 모든 조회를 동시에 발사 (직렬 대기 제거)

  loadEmployees();    // ┐
  loadCal();          // ├ 네 요청이 동시에 나가고,
  loadCalNotice();    // │ 캐시가 있으면 화면은 그전에 이미 채워져 있다.
  initRole();         // ┘
})();
</script>
